<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>J&amp;B component block</title>
<link rel="stylesheet" href="./editor.css">
<script src="https://cdn.jsdelivr.net/npm/blocksdk@1.3.0/blocksdk.js"></script>
<script type="module" src="./editor.js"></script>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="panel-head">
      <div class="brand">Justerini &amp; Brooks</div>
      <label class="picker">
        <span>Component</span>
        <select id="component"></select>
      </label>
    </header>
    <div id="issues" class="issues" hidden></div>
    <form id="form" class="form" autocomplete="off"></form>
  </aside>
  <main class="preview" id="preview" hidden>
    <div class="preview-bar">
      <span class="preview-title">Preview (standalone mode)</span>
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" data-width="700" aria-pressed="true">Desktop</button>
        <button type="button" data-width="375" aria-pressed="false">Mobile</button>
      </div>
    </div>
    <div class="frame-wrap"><iframe id="frame" title="Email preview" width="700"></iframe></div>
  </main>
</div>
</body>
</html>
